name: 🧩 CI - Spring Boot + Terraform + LocalStack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sqs,dynamodb,ses
          DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DEBUG: 1
        options: >-
          --health-cmd="curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=10

    steps:
      # ──────────────────────────────
      # 1. Checkout repository
      # ──────────────────────────────
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────
      # 2. Set up JDK 17
      # ──────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # ──────────────────────────────
      # 3. Build Spring Boot app
      # ──────────────────────────────
      - name: 🏗️ Build with Maven
        run: mvn -B clean package -DskipTests

      # ──────────────────────────────
      # 4. Run unit + integration tests
      # ──────────────────────────────
      - name: 🧪 Run tests with LocalStack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
        run: mvn test

      # ──────────────────────────────
      # 5. Set up Terraform
      # ──────────────────────────────
      - name: 🌍 Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: ⚙️ Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      # ──────────────────────────────
      # 6. Validate Terraform
      # ──────────────────────────────
      - name: 🧾 Terraform Validate
        working-directory: terraform
        run: terraform validate

      # ──────────────────────────────
      # 7. Terraform Plan
      # ──────────────────────────────
      - name: 🧮 Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      # ──────────────────────────────
      # 8. Terraform Apply
      # ──────────────────────────────
      - name: 🚀 Terraform Apply (LocalStack)
        working-directory: terraform
        run: terraform apply -auto-approve

      # ──────────────────────────────
      # 9. Verify Terraform Outputs
      # ──────────────────────────────
      - name: 🔍 Terraform Outputs
        working-directory: terraform
        run: terraform output

      # ──────────────────────────────
      # 10. Terraform Destroy (Clean up)
      # ──────────────────────────────
      - name: 🧹 Terraform Destroy (cleanup)
        if: always()
        working-directory: terraform
        run: terraform destroy -auto-approve
